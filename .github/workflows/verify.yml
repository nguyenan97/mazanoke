name: Verify without deployment
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/images/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '.github/images/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Standard runners are free for public repos; never start this job on a private fork.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run check
      - name: Browser regression on local build
        run: |
          mkdir -p output/playwright
          node scripts/serve.mjs > /tmp/anhgon-server.log 2>&1 &
          npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=ci open http://127.0.0.1:4173/en/ --browser chrome
          npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=ci run-code --filename scripts/qa/browser-release.js
          npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=ci run-code --filename scripts/qa/tiff-orientation.js
          npx --yes --package @playwright/cli@0.1.22 playwright-cli -s=ci close
      - run: docker build -t anhgon-qa .
      - run: node scripts/qa/docker-smoke.mjs anhgon-qa
