[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # Keep Netlify's default HTML revalidation; asset cache policies come from
    # generated _headers. A global Cache-Control here overrides those policies.

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
