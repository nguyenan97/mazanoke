<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#f7f8fb">
  {{metadata}}
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="{{manifest}}">
  <link rel="stylesheet" href="{{styleUrl}}">
  <script src="{{themeUrl}}"></script>
</head>
<body>
  <a class="skip-link" href="#main">{{skip}}</a>
  <header class="topbar">
    <a class="brand" href="{{homeUrl}}"><span class="brand-mark" aria-hidden="true">ag</span><span>{{brand}}</span></a>
    <nav aria-label="{{tools}}"><a href="{{homeUrl}}">{{tools}}</a><a href="#guide">{{guide}}</a></nav>
    <div class="top-actions"><a class="language" href="{{alternateUrl}}" lang="{{alternateLocale}}" hreflang="{{alternateLocale}}">{{language}}</a><button id="theme" class="icon-button" aria-label="{{theme}}" title="{{theme}}">◐</button></div>
  </header>
  <main id="main" class="shell">
    <div class="intro"><p class="eyebrow">{{eyebrow}}</p><h1>{{h1}}</h1><p class="intro-copy">{{intro}}</p><p class="trust"><span aria-hidden="true">✓</span> {{free}}</p></div>
    {{body}}
    <section id="related" class="related"><h2>{{related}}</h2><div class="tool-links">{{relatedLinks}}</div></section>
  </main>
  <footer class="shell footer"><div><strong>{{brand}}</strong><p>{{private}}</p></div><div class="footer-links"><a href="{{aboutUrl}}">{{about}}</a><a href="{{privacyUrl}}">{{privacy}}</a><a href="{{sourceUrl}}">{{source}}</a><a href="https://github.com/civilblur/mazanoke">{{attribution}}</a><a href="/ATTRIBUTIONS.md">Attributions</a><a href="/LICENSE">GPL-3.0</a></div></footer>
  <div class="update-toast" id="update" hidden><span>{{update}}</span><button id="reload">{{reload}}</button></div>
  <script id="page-config" type="application/json">{{pageConfig}}</script>
  <script type="module" src="{{appUrl}}"></script>
</body>
</html>
