server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Optional auth directives are inserted at server level by basicauth.sh.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    # Canonicalize only explicit requests; do not redirect internal index lookup.
    if ($request_uri ~ ^(.*/)index\.html(?:\?.*)?$) { return 301 $1; }
    location / { try_files $uri $uri/ =404; }
    location = /service-worker.js { default_type application/javascript; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
